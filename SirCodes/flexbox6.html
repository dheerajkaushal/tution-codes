<!--CSS align-content Property
The align-content property is similar to align-items, but instead of 
aligning the flex items, it aligns the flex lines.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            height: 400px;
            flex-wrap: wrap;
            align-content:center;
            overflow: scroll;  
            background-color: DodgerBlue;
        }
        .container div {
            background-color: #f1f1f1;
            width: 200px;
            margin: 10px;
            padding: 20px;
            text-align: center;  
            font-size: 30px;
        }
    </style>
</head>
<body>
    <h1>justify-content: center</h1>
    <div class="container">
        <div>India</div>
        <div>Australia</div>
        <div>England</div>
        <div>Pakistan</div>
        <div>Afganistan</div>
        <div>Bangladesh</div>
        <div>NewZeland</div>
        <div>SriLanka</div>
        <div>WestIndies</div>
        <div>South Africa</div>  
    </div>
</body>
</html>
