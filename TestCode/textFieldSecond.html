<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var textArray= [];
        let textLength=0;
        let dotCount=0;
        let arthOperator=0;
        let operatorPos=0;
        let tempVar=0;
        let resultVar=0;

        document.addEventListener('keydown', function (event) 
        {
            let labelObj = document.getElementById("textIDSec");
            let resultObj = document.getElementById("output");

            if (event.key >= "0" && event.key <= "9")
            {
                if (textLength == 0) labelObj.textContent = "";
                arthOperator = 1;
                textArray[textLength++]=event.key;
                labelObj.textContent= textArray.join('');
                if(operatorPos!=0)
                {
                    switch(textArray[operatorPos-1])
                    {
                          case "+": 
                            resultVar = tempVar + parseFloat(labelObj.textContent.slice(operatorPos, textLength));
                            //console.log(parseFloat(labelObj.textContent.slice(operatorPos, textLength)));
                            break;

                        case "-":
                            resultVar = tempVar - parseFloat(labelObj.textContent.slice(operatorPos, textLength));
                            break;

                        case "*":
                            console.log(tempVar);
                            console.log(parseFloat(labelObj.textContent.slice(operatorPos, textLength)));
                            console.log(tempVar * parseFloat(labelObj.textContent.slice(operatorPos, textLength)));
                            // resultVar = tempVar * parseFloat(labelObj.textContent.slice(operatorPos, textLength));
                            break;

                        case "%":
                           // console.log(tempVar);
                           // console.log(parseFloat(labelObj.textContent.slice(operatorPos, textLength)));
                            resultVar = tempVar/100 * parseFloat(labelObj.textContent.slice(operatorPos, textLength));
                            break;

                        case "/":
                            resultVar = tempVar / parseFloat(labelObj.textContent.slice(operatorPos, textLength));
                            break;
                    } 
                    resultObj.textContent=resultVar.toString();
                } 
            }
            else if (event.key == "+" || event.key == "-" || event.key == "%" || event.key == "*" || event.key == "/") 
            {
                if (arthOperator == 0) return;
                arthOperator=0;
                textArray[textLength++] = event.key;
                labelObj.textContent = textArray.join('');
                operatorPos=textLength;
                tempVar=resultVar;
                if (tempVar == 0) tempVar = parseFloat(labelObj.textContent.slice(0, operatorPos - 1));
            }
            else if(event.key=="Enter")
            {
                resultObj.style.fontSize="25px";
            }    
        })
    </script>
</head>
<body>
    </div>
    <div>
        <label id="textIDSec">0</label><br>
        <label id="output"></label>
    </div>
</body>
</html>
